name: Gold bot (test run)

# Runs the bot for up to ~5h50m per run (GitHub's limit is 6h per job).
# A scheduled start every hour keeps one run waiting in line, so when a run ends the
# next starts right away. To stop the restarts: add the repo variable BOT_ENABLED = false
# (or Actions -> Gold bot -> "..." -> Disable workflow), then cancel the running run.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to run (max 350)"
        default: "350"
  schedule:
    - cron: "57 * * * *"

concurrency:
  group: gold-bot
  cancel-in-progress: false

permissions:
  contents: write   # the bot updates TRADES.md (trade log) in this repo

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run bot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          LIVE: ${{ vars.LIVE || 'true' }}
          DOLLARS_PER_TRADE: ${{ vars.DOLLARS_PER_TRADE || '1' }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '0' }}
          BAND_LOW: ${{ vars.BAND_LOW || '90' }}
          BAND_HIGH: ${{ vars.BAND_HIGH || '95' }}
          START_SECONDS: ${{ vars.START_SECONDS || '120' }}
          STABLE_SECONDS: ${{ vars.STABLE_SECONDS || '60' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '350' }}
        run: python bot.py
