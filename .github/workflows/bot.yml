name: Gold bot (test run)

# Runs the bot for ~5h40m per run (GitHub's limit is 6h per job). Just before a run ends it
# starts the next one, so there's no gap. The hourly schedule is only a backup: it checks first
# and does nothing if a bot run is already running or waiting.
# To stop: add the repo variable BOT_ENABLED = false, then cancel the running run.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to run (max 350)"
        default: "350"
  schedule:
    - cron: "57 * * * *"

permissions:
  contents: write   # the bot updates TRADES.md (trade log) in this repo
  actions: write    # each run starts the next one, so there's no gap between runs

jobs:
  check:
    # backup start only: skip if another bot run is already running or queued
    runs-on: ubuntu-latest
    outputs:
      busy: ${{ steps.c.outputs.busy }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "busy=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=0
          for st in in_progress queued waiting pending; do
            k=$(gh api "repos/${{ github.repository }}/actions/workflows/bot.yml/runs?status=$st" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
            n=$((n + k))
          done
          echo "other bot runs: $n"
          if [ "$n" -gt 0 ]; then echo "busy=true" >> "$GITHUB_OUTPUT"; else echo "busy=false" >> "$GITHUB_OUTPUT"; fi
  run:
    needs: check
    if: needs.check.outputs.busy != 'true' && (github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED != 'false')
    concurrency:
      group: gold-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run bot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          LIVE: ${{ vars.LIVE || 'true' }}
          DOLLARS_PER_TRADE: ${{ vars.DOLLARS_PER_TRADE || '1' }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '0' }}
          BAND_LOW: ${{ vars.BAND_LOW || '70' }}
          BAND_HIGH: ${{ vars.BAND_HIGH || '95' }}
          START_SECONDS: ${{ vars.START_SECONDS || '180' }}
          STABLE_SECONDS: ${{ vars.STABLE_SECONDS || '0' }}
          Z_MIN: ${{ vars.Z_MIN || '1' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '340' }}
        run: python bot.py
      - name: Start the next run
        # runs when the bot finished or crashed, not when someone cancelled the run (cancel = stop)
        if: (success() || failure()) && vars.BOT_ENABLED != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" -f minutes=340
